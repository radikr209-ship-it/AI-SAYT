<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YARASHOVGPT</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eefaf6;--card:#fff;--tx:#1b1d29;--mut:#6b7085;--bd:#d2e9e1;--g1:#0ea5e9;--g2:#10b981;--ub:linear-gradient(135deg,#0ea5e9,#10b981)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06151a;--card:#0d2129;--tx:#eceef7;--mut:#9a9fb5;--bd:#1a3a45}}
:root[data-theme="dark"]{--bg:#06151a;--card:#0d2129;--tx:#eceef7;--mut:#9a9fb5;--bd:#1a3a45}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1;background:var(--ub);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.m{display:flex;margin:10px 0}
.m.u{justify-content:flex-end}
.bb{max-width:88%;padding:10px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.u .bb{background:var(--ub);color:#fff;border-bottom-right-radius:4px}
.a .bb{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bb img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin-bottom:6px}
.bb code{background:rgba(127,127,127,.18);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.bb pre{background:rgba(127,127,127,.15);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0}
.bb pre code{background:none;padding:0}
.hero{text-align:center;margin-top:12vh;color:var(--mut)}
.hero .e{font-size:48px}
.hero h2{color:var(--tx);margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px}
footer{background:var(--card);border-top:1px solid var(--bd);padding:10px 12px}
.cm{max-width:820px;margin:0 auto}
#pw{display:none;position:relative;width:max-content;margin-bottom:8px}
#pv{height:70px;border-radius:10px;display:block}
#rx{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:#333;color:#fff;cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;border:1px solid var(--bd);border-radius:14px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--tx)}
#go{border:0;border-radius:14px;width:46px;height:44px;background:var(--ub);color:#fff;font-size:18px;cursor:pointer}
#go:disabled{opacity:.5}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(320px,86%);background:var(--card);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;overflow-y:auto;z-index:10;transform:translateX(-100%);transition:transform .2s}
body.o #dr{transform:none}body.o #ov{display:block}
.it{display:flex;gap:6px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.it.on{border-color:var(--g1);background:var(--bg)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.it button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.nw{width:100%;border:0;border-radius:12px;padding:11px;background:var(--ub);color:#fff;font:inherit;cursor:pointer;margin-bottom:12px}
.err{color:#e5484d}
body{background-image:radial-gradient(60% 40% at 10% 0%,rgba(14,165,233,.28),transparent),radial-gradient(50% 40% at 100% 10%,rgba(16,185,129,.26),transparent),radial-gradient(50% 40% at 50% 100%,rgba(6,182,212,.2),transparent);background-attachment:fixed}
header,footer{background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header h1{letter-spacing:1.5px;font-weight:800}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ib,.chip,#go{box-shadow:0 8px 20px rgba(14,165,233,.3);animation:fl 3s ease-in-out infinite}
.chip:nth-child(2),#ph{animation-delay:.7s}.chip:nth-child(3),#nc{animation-delay:1.4s}
.ib:hover,.chip:hover,#go:hover{transform:translateY(-3px) scale(1.06);animation-play-state:paused}
#go{border-radius:50%;width:48px;height:48px}
.ib{border-radius:14px}
.bb{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.hero .e{animation:fl 3s ease-in-out infinite;font-size:58px}
.hero h2{background:var(--ub);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
@media (prefers-reduced-motion:reduce){.ib,.chip,#go,.hero .e{animation:none}}
.fab{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;flex:none;background:var(--card)}
#gal{animation-delay:.7s}
.u .bb{background:linear-gradient(135deg,#0ea5e9,#10b981)}
.it.on{border-color:#10b981}
.bb{border-radius:20px}
#st{display:none;margin:8px 16px 0;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid #10b981;font-size:14px}
.lg{flex:none;filter:drop-shadow(0 4px 10px rgba(14,165,233,.45))}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:26px;padding:10px 12px}
.box textarea{border:0;background:transparent;width:100%;min-height:44px;padding:6px 4px;border-radius:0}
.box textarea:focus{outline:none}
.br{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#plus{font-size:26px;line-height:1;width:58px;height:44px;border-radius:24px;padding:0}
#fn{display:none;margin-bottom:6px;font-size:13px;padding:4px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);cursor:pointer}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
body.s #sh{display:flex}
.sc{width:100%;background:var(--card);border-radius:26px 26px 0 0;padding:12px 16px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.hd{width:44px;height:4px;border-radius:2px;background:var(--mut);opacity:.5;margin:0 auto 18px}
.tl{display:flex;gap:12px;max-width:520px;margin:0 auto}
.tl button{flex:1;border:0;background:var(--bg);color:var(--tx);border-radius:24px;padding:22px 6px 14px;font:inherit;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px}
.tl button:active{transform:scale(.96)}
.tl span{font-size:30px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="lgs" viewBox="0 0 48 48"><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#10b981"/></linearGradient><rect width="48" height="48" rx="14" fill="url(#lgg)"/><path d="M13 17l11 11 11-11M24 28v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 5.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff"/></symbol></svg>
<header>
  <button class="ib" id="mn">☰</button>
  <svg class="lg" width="38" height="38" viewBox="0 0 48 48" role="img" aria-label="YARASHOVGPT logo"><use href="#lgs"/></svg>
  <h1>YARASHOVGPT</h1>
  <span class="ib" id="lm" style="animation:none;box-shadow:none;font-size:13px"></span><button class="ib" id="nc">＋ Yangi</button>
</header>
<div id="st"></div>
<div id="msgs"></div>
<footer><div class="cm"><div class="box">
  <div id="pw"><img id="pv" alt=""><button id="rx">✕</button></div>
  <div id="fn"></div>
  <textarea id="q" rows="1" placeholder="Savol bering"></textarea>
  <div class="br"><button class="ib fab" id="plus" aria-label="Qo'shish">+</button><button id="go">➤</button></div>
</div></div></footer>
<input id="fc" type="file" accept="image/*" capture="environment" hidden>
<input id="f" type="file" accept="image/*" hidden>
<input id="ft" type="file" accept="image/*,.txt,.md,.csv,.json,.py,.js,.html,.css,text/*" hidden>
<div id="sh"><div class="sc"><div class="hd"></div><div class="tl">
  <button id="gal"><span>🖼️</span>Galereya</button>
  <button id="cam"><span>📷</span>Kamera</button>
  <button id="fl"><span>📎</span>Fayllar</button>
</div></div></div>
<div id="ov"></div>
<div id="dr"><button class="nw" id="nw2">＋ Yangi suhbat</button><div id="ls"></div></div>
<script>
const $=id=>document.getElementById(id);
const KEY="aibot.v1";
const LIMIT=20;
let stT;function note(m){const e=$("st");e.textContent=m;e.style.display=m?"block":"none";clearTimeout(stT);if(m)stT=setTimeout(()=>{e.style.display="none"},6000)}
function dk(){return new Date().toISOString().slice(0,10)}
function used(){try{const d=JSON.parse(localStorage.getItem("aibot.lim")||"{}");return d.d===dk()?d.n:0}catch(e){return 0}}
function bump(){try{localStorage.setItem("aibot.lim",JSON.stringify({d:dk(),n:used()+1}))}catch(e){}showLim()}
function showLim(){$("lm").textContent="⚡ "+Math.max(0,LIMIT-used())+"/"+LIMIT}
let S={chats:[],cur:null},img=null,sample=null,canImg=false,busy=false;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.chats)S=d}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cur(){return S.chats.find(c=>c.id===S.cur)}
function newChat(){const c={id:Date.now().toString(36),title:"Yangi suhbat",msgs:[]};S.chats.unshift(c);S.cur=c.id;save();render();list()}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){
  s=esc(s);
  s=s.replace(/```(?:\w*\n)?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c+"</code></pre>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  return s.replace(/\n/g,"<br>").replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,(m)=>m.replace(/<br>/g,"\n"));
}
function bubble(m){
  const d=document.createElement("div");d.className="m "+m.r;
  const b=document.createElement("div");b.className="bb";
  if(m.img){const i=document.createElement("img");i.src=m.img;b.appendChild(i)}
  const t=document.createElement("div");t.innerHTML=m.r==="a"?md(m.t):esc(m.t).replace(/\n/g,"<br>");b.appendChild(t);
  d.appendChild(b);d._t=t;return d;
}
function render(){
  const box=$("msgs"),c=cur();box.innerHTML="";
  if(!c||!c.msgs.length){
    box.innerHTML='<div class="hero"><div class="e"><svg width="80" height="80" viewBox="0 0 48 48"><use href="#lgs"/></svg></div><h2>YARASHOVGPT ga xush kelibsiz!</h2><div>Savol yozing yoki misol rasmini yuboring</div><div class="chips"></div></div>';
    ["2x + 5 = 17 tenglamani yech","Fotosintez nima?","Python da sort qanday ishlaydi?"].forEach(t=>{
      const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>{$("q").value=t;send()};box.querySelector(".chips").appendChild(b)});
    return;
  }
  c.msgs.forEach(m=>box.appendChild(bubble(m)));box.scrollTop=box.scrollHeight;
}
function list(){
  const l=$("ls");l.innerHTML="";
  S.chats.forEach(c=>{
    const d=document.createElement("div");d.className="it"+(c.id===S.cur?" on":"");
    const s=document.createElement("span");s.textContent=c.title;
    const x=document.createElement("button");x.textContent="🗑";
    x.onclick=e=>{e.stopPropagation();S.chats=S.chats.filter(k=>k.id!==c.id);if(S.cur===c.id)S.cur=S.chats[0]?S.chats[0].id:null;if(!S.cur)newChat();else{save();render();list()}};
    d.onclick=()=>{S.cur=c.id;save();render();list();document.body.classList.remove("o")};
    d.append(s,x);l.appendChild(d);
  });
}
function thumb(file){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{const k=Math.min(1,220/Math.max(i.width,i.height)),c=document.createElement("canvas");
      c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.6))};
    i.onerror=()=>res(null);i.src=u;
  });
}
const SYS="Sen foydali, do'stona AI yordamchisan. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber. Rasmda masala yoki misol bo'lsa, uni bosqichma-bosqich yech va yakuniy javobni aniq ko'rsat. Formulalarni oddiy matn bilan yoz.\n\n";
async function send(){
  if(busy)return;
  const t=$("q").value.trim();
  if(!t&&!img&&!txt)return;
  if(used()>=LIMIT){note("Bugungi limit tugadi ("+LIMIT+" ta savol). Ertaga qaytib keling!");return}
  if(!cur())newChat();
  const c=cur(),file=img,th=file?await thumb(file):null;
  const tf=txt;txt=null;showFn();const um={r:"u",t:(t||(file?"Rasmdagi savolga javob ber.":"Fayl haqida yordam ber."))+(tf?"\n📎 "+tf.name:""),img:th};
  c.msgs.push(um);
  if(c.msgs.length===1)c.title=um.t.slice(0,40);
  $("q").value="";$("q").style.height="";clearImg();
  const box=$("msgs");if(c.msgs.length===1)box.innerHTML="";
  box.appendChild(bubble(um));
  const am={r:"a",t:""},ab=bubble(am);ab._t.textContent="O'ylayapman...";box.appendChild(ab);box.scrollTop=box.scrollHeight;
  busy=true;$("go").disabled=true;
  const hist=c.msgs.slice(-13).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  if(tf)hist[hist.length-1].content+="\n\n[Fayl: "+tf.name+"]\n"+tf.text;
  try{
    if(file){const b=await toB64(file);const L=hist[hist.length-1];L.content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b}},{type:"text",text:L.content}]}
    const resp=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist})});
    const r=await resp.json();if(!resp.ok)throw r;
    am.t=r.text;ab._t.innerHTML=md(am.t);
    c.msgs.push(am);bump();
  }catch(e){
    ab._t.innerHTML='<span class="err">'+(e&&e.error==="limit"?"Bugungi limit tugadi. Ertaga qaytib keling!":e&&e.code==="rate_limited"?"Juda ko'p so'rov, birozdan keyin urinib ko'ring.":"Javob olib bo'lmadi. Qayta urinib ko'ring.")+'</span>';
    c.msgs.pop();
  }
  save();list();busy=false;$("go").disabled=false;box.scrollTop=box.scrollHeight;
}
let txt=null;function showFn(){$("fn").textContent=txt?"📎 "+txt.name+"  ✕":"";$("fn").style.display=txt?"inline-block":"none"}
function clearImg(){img=null;$("f").value="";$("fc").value="";$("pw").style.display="none"}
function pick(e){const f=e.target.files[0];if(!f)return;img=f;$("pv").src=URL.createObjectURL(f);$("pw").style.display="block";e.target.value=""}
$("f").onchange=pick;$("fc").onchange=pick;
$("rx").onclick=clearImg;
const cs=()=>document.body.classList.remove("s");
$("plus").onclick=()=>document.body.classList.add("s");
$("sh").onclick=e=>{if(e.target===$("sh"))cs()};
$("cam").onclick=()=>{cs();$("fc").click()};$("gal").onclick=()=>{cs();$("f").click()};$("fl").onclick=()=>{cs();$("ft").click()};
$("ft").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(f.type.startsWith("image/")){pick({target:{files:[f],value:""}});return}const r=new FileReader();r.onload=()=>{txt={name:f.name,text:String(r.result).slice(0,20000)};showFn()};r.readAsText(f)};
$("fn").onclick=()=>{txt=null;showFn()};
$("go").onclick=send;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
$("q").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"});
$("mn").onclick=()=>document.body.classList.add("o");
$("ov").onclick=()=>document.body.classList.remove("o");
$("nc").onclick=$("nw2").onclick=()=>{const c=cur();if(c&&!c.msgs.length){render()}else newChat();document.body.classList.remove("o")};
showLim();load();if(!cur()){if(S.chats.length)S.cur=S.chats[0].id;else newChat()}
render();list();
function toB64(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{const k=Math.min(1,1568/Math.max(i.width,i.height)),c=document.createElement("canvas");
      c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85).split(",")[1])};
    i.onerror=rej;i.src=u;
  });
}
</script>
</body>
</html>
